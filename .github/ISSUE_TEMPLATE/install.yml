name: Install problem
description: The install script, the zip, or Set Up Corral did not work.
labels: [install]
body:
  - type: dropdown
    id: method
    attributes:
      label: How did you install?
      options: [curl install script, Downloaded zip, Built from source]
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: macOS 15.2, Apple M2
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: What you ran and what it printed
      render: shell
    validations:
      required: true
