  <!-- The prompt: chevron + cursor -->
  <path d="M 372 432 L 468 512 L 372 592" fill="none" stroke="#8fe388" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="512" y="566" width="148" height="44" rx="22" fill="#8fe388"/>
</svg>
