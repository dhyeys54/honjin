<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Corral app icon. macOS grid: 824px squircle tile inset 100px. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171d1a"/>
      <stop offset="1" stop-color="#0a0d0c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.52" r="0.5">
      <stop offset="0" stop-color="#8fe388" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8fe388" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
  <rect x="160" y="160" width="704" height="704" rx="150" fill="url(#glow)"/>
  <!-- The pen: a rounded enclosure with an open gate on the left -->
