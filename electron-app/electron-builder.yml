appId: dev.honjin.ide
productName: Honjin
directories:
  output: dist
# The Theia bundle lives in lib/ and src-gen/; plugins ship as a resource and honjin-backend-module points
# THEIA_DEFAULT_PLUGINS at them.
files:
  - package.json
  - lib/**/*
  - src-gen/**/*
extraResources:
  - from: ../plugins
    to: plugins
asar: true
asarUnpack:
  - "**/node_modules/node-pty/**"
  - "lib/prebuilds/**"
  - "**/node_modules/@theia/**/*.node"
  - "lib/backend/native/rg"   # the bundle spawns rg from app.asar.unpacked (spawn cannot run it from inside the asar)
  - "**/node_modules/drivelist/**"
mac:
  target:
    - target: zip
      arch: arm64
  icon: ../branding/generated/honjin.icns
  category: public.app-category.developer-tools
  identity: null
